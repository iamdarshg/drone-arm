requirements:
  - id: REQ-PROVENANCE
    kind: provenance
    source: {repo: iamd.../drone-arm, issue: 21, url: https://github.com/iamdarshg/drone-arm/issues/21, revision: "744994a096ca73e872b396a9b0636c58e7c1afe8"}
    severity: P0
    input_paths: [".", "../drone-mech"]
    runner: provenance
    expected: {condition: "both repository HEADs and all referenced source/artifact revisions are identified and match the run manifest"}
    tolerance: null
    unit: null
    applicability: all
    blocking: true
    evidence_required: [both_repo_git_shas, source_and_artifact_sha256, test_definition_sha256, tool_versions, command, exit_code, timestamp]
    owner_repo: drone-arm

  - id: REQ-SCHEMA-UNITS
    kind: schema_and_units
    source: {repo: iamd.../drone-arm, issue: 21, url: https://github.com/iamdarshg/drone-arm/issues/21, revision: "744994a096ca73e872b396a9b0636c58e7c1afe8"}
    severity: P0
    input_paths: [engineering_acceptance/schema]
    runner: schema_validation
    expected: {condition: "required fields and recognized units validate; nonfinite numbers, missing fields, unknown source revisions, invalid units and inconsistent coordinates are rejected"}
    tolerance: null
    unit: null
    applicability: all
    blocking: true
    evidence_required: [validator_output, invalid_fixture_receipt]
    owner_repo: drone-arm

  - id: REQ-CAD-BASELINE
    kind: cad_geometry
    source: {repo: iamd.../drone-mech, issue: 14, url: https://github.com/iamdarshg/drone-mech/issues/14, revision: "5246c90657071772e220b118967fa5f3e7c9ff7c"}
    severity: P0
    input_paths: [../drone-mech/highspeed_edf/phase15/optimization/phase15_generate_geometry.py, ../drone-mech/highspeed_edf/deliverables/phase15_geometry]
    runner: cad_occ
    expected: {condition: "consume actual source solids and report units, datums, positive volume, interferences, clearances, mass and CG"}
    tolerance: null
    unit: null
    applicability: all
    blocking: true
    evidence_required: [source_sha, imported_solid_ids, raw_geometry_receipt]
    owner_repo: drone-mech

  - id: REQ-PCB-AUTHORITY
    kind: pcb_geometry
    source: {repo: iamd.../drone-arm, issue: 23, url: https://github.com/iamdarshg/drone-arm/issues/23, revision: "744994a096ca73e872b396a9b0636c58e7c1afe8"}
    severity: P0
    input_paths: [hardware/esc/rev_b/esc_rev_b.kicad_pcb, hardware/main/rev_b/main_rev_b.kicad_pcb]
    runner: kicad
    expected: {condition: "board envelope comes from selected pinned native PCB Edge.Cuts and connectors; CAD placeholders cannot override it"}
    tolerance: null
    unit: mm
    applicability: board_selected
    blocking: true
    evidence_required: [pcb_path, pcb_git_sha, pcb_sha256, kicad_export]
    owner_repo: drone-arm

  - id: REQ-POWER-TOPOLOGY
    kind: electrical_topology
    source: {repo: iamd.../drone-arm, issue: 21, url: https://github.com/iamdarshg/drone-arm/issues/21, revision: "744994a096ca73e872b396a9b0636c58e7c1afe8"}
    severity: P0
    input_paths: [docs/hardware/REV_B_ARCHITECTURE.md, hardware/esc/rev_b]
    runner: electrical_contract
    expected: {independent_power_stages: 6, ducts: 2, stages_per_duct: 3, condition: "preserve six separately controlled motor channels and sourced distribution topology; do not infer a single 360 A PCB trunk"}
    tolerance: null
    unit: "1"
    applicability: current_powertrain
    blocking: true
    evidence_required: [architecture_source_sha, topology_manifest]
    owner_repo: drone-arm

  - id: REQ-BATTERY
    kind: battery
    source: {repo: iamd.../drone-arm, issue: 21, url: https://github.com/iamdarshg/drone-arm/issues/21, revision: "744994a096ca73e872b396a9b0636c58e7c1afe8"}
    severity: P0
    input_paths: [../drone-mech/highspeed_edf/deliverables/phase15_geometry/reports/phase15_parameter_register.json]
    runner: battery_bounds
    expected: {condition: "validate pack bounds, connectors/access, series arithmetic and sourced current topology; unknown DCIR, energy and thermal properties remain null/BLOCKED", measurements: "each battery property carries its own engineering unit"}
    tolerance: null
    unit: null
    applicability: battery_configured
    blocking: true
    evidence_required: [pack_source, typed_units, geometry_receipt, measurement_or_blocker]
    owner_repo: drone-mech

  - id: REQ-MASS-CG
    kind: mass_cg
    source: {repo: iamd.../drone-mech, issue: 14, url: https://github.com/iamdarshg/drone-mech/issues/14, revision: "5246c90657071772e220b118967fa5f3e7c9ff7c"}
    severity: P0
    input_paths: [../drone-mech/highspeed_edf/deliverables/phase15_geometry/reports/mass_cg_summary.json, ../drone-mech/highspeed_edf/deliverables/phase15_geometry/step]
