    expected: {quantities: [{name: payload_mass, value: 1.0, unit: kg}, {name: center_of_gravity, unit: m}], condition: "recompute modeled mass and CG from native solids including the 1 kg payload and reserve case; a static report alone is not proof"}
    tolerance: null
    unit: null
    applicability: payload_case
    blocking: true
    evidence_required: [native_solid_mass_properties, payload_manifest, source_sha]
    owner_repo: drone-mech

  - id: REQ-ACTUATORS
    kind: actuator_interface
