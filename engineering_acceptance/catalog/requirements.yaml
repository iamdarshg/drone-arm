    blocking: true
    evidence_required: [board_pinmap_sha, actuator_manifest_sha, cross_repo_contract_sha]
    owner_repo: drone-arm

  - id: REQ-FIRMWARE
    kind: firmware_build
    source: {repo: iamd.../drone-arm, issue: 22, url: https://github.com/iamdarshg/drone-arm/issues/22, revision: "744994a096ca73e872b396a9b0636c58e7c1afe8"}
    severity: P0
