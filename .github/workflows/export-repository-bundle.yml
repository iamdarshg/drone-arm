name: Export repository bundle

on:
  push:
    branches:
      - agent/recover-rev-b
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Git bundle
        run: git bundle create drone-arm.bundle --all
      - name: Upload repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: drone-arm-repository-bundle
          path: drone-arm.bundle
          if-no-files-found: error
          retention-days: 1
