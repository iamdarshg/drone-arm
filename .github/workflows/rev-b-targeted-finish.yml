name: Targeted Rev-B finishing passes

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: 29693302481
  JAVA_HOME: /opt/java25
  PATH: /opt/java25/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  targeted-main:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Install KiCad and runtime tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates kicad kicad-symbols kicad-footprints \
            python3 curl jq tar gzip

      - name: Install Temurin JRE 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/java25
          jre_url=$(curl -fsSL \
            'https://api.adoptium.net/v3/assets/latest/25/hotspot?architecture=x64&image_type=jre&os=linux&vendor=eclipse' \
            | jq -r '.[0].binary.package.link')
          curl -fL "$jre_url" -o /tmp/temurin25-jre.tar.gz
          tar -xzf /tmp/temurin25-jre.tar.gz --strip-components=1 -C /opt/java25
          java -version

      - name: Check out consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Download fixed router
        uses: actions/download-artifact@v4
        with:
          name: fixed-freerouting
          path: build/fixed-freerouting
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Route only the 25 open main-board nets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/targeted/main
          exec > >(tee build/targeted/main/stage.log) 2>&1
          board=hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb

          cat > build/targeted/main/open-nets.txt <<'EOF'
          /3V3
          /915 MHz RF/VDD_CC112
          /1V1
          /Power and USB/USB_VBUS
          /VREG_AVDD
          /915 MHz RF/CC1190_VDD13
          /915 MHz RF/CC1190_VDD15
          /915 MHz RF/CC_LNA_P
          /CAN interface/U50_CANH
          /CAN_SCK
          /CAN_nCS
          /GNSS_PPS
          /GNSS_RX
          /HGM
          /ICM_INT2
          /LSM_nCS
          /Power and USB/USB_DN_CONN
          /Power and USB/USB_DP_CONN
          /RF_MOSI
          /RP2354B MCU/RUN
          /RP2354B MCU/STATUS_LED
          /RP2354B MCU/SWCLK
          /RP2354B MCU/XOUT
          /SENS_MOSI
          /SENS_SCLK
          EOF
          sed -i 's/^          //' build/targeted/main/open-nets.txt

          set +e
          python3 tools/hardware/route_rev_b_sections.py strip-zones \
            --board "$board" \
            --output build/targeted/main/main-nozones.kicad_pcb
          echo $? > build/targeted/main/strip-zones.exit
          set -e
          test -s build/targeted/main/main-nozones.kicad_pcb

          python3 tools/hardware/route_rev_b_sections.py export-main \
            --board build/targeted/main/main-nozones.kicad_pcb \
            --dsn build/targeted/main/main-all.dsn
          python3 tools/hardware/filter_specctra_dsn.py \
            --source build/targeted/main/main-all.dsn \
            --output build/targeted/main/main-targeted.dsn \
            --mode names \
            --names-file build/targeted/main/open-nets.txt \
            --report build/targeted/main/filter-report.json

          set +e
          timeout 55m java -Xmx6g -Djava.awt.headless=true \
            -jar build/fixed-freerouting/freerouting-current-executable.jar \
            --gui.enabled=false \
            -de build/targeted/main/main-targeted.dsn \
            -do build/targeted/main/main-targeted.ses \
            -mp 40 -mt 2 -oit 0.01 -us hybrid -hr 1:2 -is prioritized \
            -da -dct 1 --logging.console.level=INFO --logging.file.enabled=false \
            > build/targeted/main/freerouting.log 2>&1
          echo $? > build/targeted/main/freerouting.exit
          set -e
          test -s build/targeted/main/main-targeted.ses

          python3 tools/hardware/route_rev_b_sections.py import-main \
            --board "$board" \
            --ses build/targeted/main/main-targeted.ses \
            --output build/targeted/main/main-imported.kicad_pcb
          python3 tools/hardware/route_rev_b_sections.py clean-main-import \
            --board build/targeted/main/main-imported.kicad_pcb \
            --output build/targeted/main/main-clean.kicad_pcb
          python3 tools/hardware/route_rev_b_sections.py fill-zones \
            --board build/targeted/main/main-clean.kicad_pcb \
            --output build/targeted/main/main-targeted-filled.kicad_pcb

          set +e
          kicad-cli pcb drc --severity-all --format json \
            -o build/targeted/main/drc.json \
            build/targeted/main/main-targeted-filled.kicad_pcb
          echo $? > build/targeted/main/drc.exit
          python3 tools/hardware/audit_rev_b_pcb.py \
            --kind main \
            --board build/targeted/main/main-targeted-filled.kicad_pcb \
            --output build/targeted/main/layout-audit.json
          echo $? > build/targeted/main/layout-audit.exit
          set -e
          jq '{unconnected: (.unconnected_items | length), violations: (.violations | length), error_violations: ([.violations[] | select(.severity == "error")] | length)}' \
            build/targeted/main/drc.json | tee build/targeted/main/summary.json

      - name: Upload targeted main result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev-b-main-targeted
          path: build/targeted/main
          if-no-files-found: error
          retention-days: 3

  targeted-esc-shared:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Install KiCad and runtime tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates kicad kicad-symbols kicad-footprints \
            python3 curl jq tar gzip

      - name: Install Temurin JRE 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/java25
          jre_url=$(curl -fsSL \
            'https://api.adoptium.net/v3/assets/latest/25/hotspot?architecture=x64&image_type=jre&os=linux&vendor=eclipse' \
            | jq -r '.[0].binary.package.link')
          curl -fL "$jre_url" -o /tmp/temurin25-jre.tar.gz
          tar -xzf /tmp/temurin25-jre.tar.gz --strip-components=1 -C /opt/java25
          java -version

      - name: Check out consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Download fixed router and replicated ESC checkpoint
        uses: actions/download-artifact@v4
        with:
          name: fixed-freerouting
          path: build/fixed-freerouting
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download replicated ESC checkpoint
        uses: actions/download-artifact@v4
        with:
          name: rev-b-esc-routed
          path: build/source-esc
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Route only the 61 ESC shared-section nets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/targeted/esc
          exec > >(tee build/targeted/esc/stage.log) 2>&1
          routed=build/source-esc/build/rev-b-router/esc/esc-replicated.kicad_pcb
          no_zones=build/source-esc/build/rev-b-router/esc/esc-replicated-nozones.kicad_pcb
          test -s "$routed"
          test -s "$no_zones"

          python3 tools/hardware/route_rev_b_sections.py export-main \
            --board "$no_zones" \
            --dsn build/targeted/esc/esc-all.dsn
          python3 tools/hardware/filter_specctra_dsn.py \
            --source build/targeted/esc/esc-all.dsn \
            --output build/targeted/esc/esc-shared.dsn \
            --mode shared-esc \
            --report build/targeted/esc/filter-report.json

          set +e
          timeout 80m java -Xmx6g -Djava.awt.headless=true \
            -jar build/fixed-freerouting/freerouting-current-executable.jar \
            --gui.enabled=false \
            -de build/targeted/esc/esc-shared.dsn \
            -do build/targeted/esc/esc-shared.ses \
            -mp 60 -mt 2 -oit 0.01 -us hybrid -hr 1:2 -is prioritized \
            -da -dct 1 --logging.console.level=INFO --logging.file.enabled=false \
            > build/targeted/esc/freerouting.log 2>&1
          echo $? > build/targeted/esc/freerouting.exit
          set -e
          test -s build/targeted/esc/esc-shared.ses

          python3 tools/hardware/route_rev_b_sections.py import-main \
            --board "$routed" \
            --ses build/targeted/esc/esc-shared.ses \
            --output build/targeted/esc/esc-imported.kicad_pcb
          python3 tools/hardware/route_rev_b_sections.py fill-zones \
            --board build/targeted/esc/esc-imported.kicad_pcb \
            --output build/targeted/esc/esc-targeted-filled.kicad_pcb

          set +e
          kicad-cli pcb drc --severity-all --format json \
            -o build/targeted/esc/drc.json \
            build/targeted/esc/esc-targeted-filled.kicad_pcb
          echo $? > build/targeted/esc/drc.exit
          python3 tools/hardware/audit_rev_b_pcb.py \
            --kind esc \
            --board build/targeted/esc/esc-targeted-filled.kicad_pcb \
            --output build/targeted/esc/layout-audit.json
          echo $? > build/targeted/esc/layout-audit.exit
          set -e
          jq '{unconnected: (.unconnected_items | length), violations: (.violations | length), error_violations: ([.violations[] | select(.severity == "error")] | length)}' \
            build/targeted/esc/drc.json | tee build/targeted/esc/summary.json

      - name: Upload targeted ESC result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev-b-esc-targeted
          path: build/targeted/esc
          if-no-files-found: error
          retention-days: 3
