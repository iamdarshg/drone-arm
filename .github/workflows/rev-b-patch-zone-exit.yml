name: Patch Rev-B zone-strip teardown

on:
  push:
    branches:
      - agent/rev-b-fab-ready
    paths:
      - .github/workflows/rev-b-patch-zone-exit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out guarded branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Patch and commit teardown bypass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rev-B Hardware Bot"
          git config user.email "actions@users.noreply.github.com"

          cat > /tmp/patch-zone-strip.py <<'PY'
          from pathlib import Path

          path = Path('tools/hardware/route_rev_b_sections.py')
          text = path.read_text()
          if '\nimport os\n' not in text:
              text = text.replace('import json\nimport re\n', 'import json\nimport os\nimport re\n', 1)
          old = '''def strip_zones(board_path: Path, output_path: Path) -> None:
              """Remove copper zones in a dedicated process (KiCad SWIG safety)."""
              board = pcbnew.LoadBoard(str(board_path))
              removed_zones = len(list(board.Zones()))
              for zone in list(board.Zones()):
                  board.Remove(zone)
              pcbnew.SaveBoard(str(output_path), board)
              print(json.dumps({"removed_zones": removed_zones, "output": str(output_path)}, indent=2))
          '''
          new = '''def strip_zones(board_path: Path, output_path: Path) -> None:
              """Remove zones, save, then bypass the unstable pcbnew teardown path."""
              board = pcbnew.LoadBoard(str(board_path))
              removed_zones = len(list(board.Zones()))
              for zone in list(board.Zones()):
                  board.Remove(zone)
              pcbnew.SaveBoard(str(output_path), board)
              print(
                  json.dumps(
                      {"removed_zones": removed_zones, "output": str(output_path)},
                      indent=2,
                  ),
                  flush=True,
              )
              os._exit(0)
          '''
          if old not in text:
              if 'os._exit(0)' in text:
                  raise SystemExit(0)
              raise SystemExit('expected strip_zones block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          for attempt in 1 2 3; do
            git fetch origin agent/rev-b-fab-ready
            git reset --hard origin/agent/rev-b-fab-ready
            python3 /tmp/patch-zone-strip.py
            rm -f .github/workflows/rev-b-patch-zone-exit.yml
            git add -A
            git diff --cached --check
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'fix: bypass pcbnew teardown after zone strip'
            if git push origin HEAD:agent/rev-b-fab-ready; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying."
          done
          exit 1
