name: Route Rev-B PCBs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FREEROUTING_VERSION: 2.2.4
  KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD9_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints

jobs:
  route-main:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Install routing tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            kicad kicad-symbols kicad-footprints \
            python3 python3-venv default-jre-headless curl jq

      - name: Check out consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Download Freerouting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rev-b-router
          asset_url=$(curl -fsSL \
            "https://api.github.com/repos/freerouting/freerouting/releases/tags/v${FREEROUTING_VERSION}" \
            | jq -r '.assets[] | select(.name == "freerouting-'"${FREEROUTING_VERSION}"'.jar") | .browser_download_url')
          test -n "$asset_url"
          test "$asset_url" != "null"
          curl -fL "$asset_url" -o build/rev-b-router/freerouting.jar
          java -version 2>&1 | tee build/rev-b-router/java-version.txt

      - name: Export and route main control board
        shell: bash
        run: |
          set -euo pipefail
          board=hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb
          python3 tools/hardware/route_rev_b_specctra.py export \
            "$board" build/rev-b-router/main.dsn
          set +e
          timeout 120m java -Xmx6g -Djava.awt.headless=true \
            -jar build/rev-b-router/freerouting.jar \
            --gui.enabled=false \
            -de build/rev-b-router/main.dsn \
            -do build/rev-b-router/main.ses \
            -mp 100 -mt 2 -oit 0.02 -us hybrid -hr 1:2 -is prioritized \
            -da -dct 1 --logging.console.level=INFO --logging.file.enabled=false \
            > build/rev-b-router/main-freerouting.log 2>&1
          router_rc=$?
          set -e
          echo "$router_rc" > build/rev-b-router/main-freerouting.exit
          test -s build/rev-b-router/main.ses
          python3 tools/hardware/route_rev_b_specctra.py import \
            "$board" build/rev-b-router/main.ses
          set +e
          kicad-cli pcb drc --severity-all --format json \
            -o build/rev-b-router/main-drc.json "$board"
          echo $? > build/rev-b-router/main-drc.exit
          set -e
          jq '{unconnected: (.unconnected_items | length), violations: (.violations | length), error_violations: ([.violations[] | select(.severity == "error")] | length)}' \
            build/rev-b-router/main-drc.json | tee build/rev-b-router/main-summary.json

      - name: Upload main routed board
        uses: actions/upload-artifact@v4
        with:
          name: rev-b-main-routed
          path: |
            hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb
            build/rev-b-router/main.*
            build/rev-b-router/main-*
            build/rev-b-router/java-version.txt
          if-no-files-found: error
          retention-days: 3

  route-esc:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Install routing tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            kicad kicad-symbols kicad-footprints \
            python3 python3-venv default-jre-headless curl jq

      - name: Check out consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Download Freerouting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rev-b-router
          asset_url=$(curl -fsSL \
            "https://api.github.com/repos/freerouting/freerouting/releases/tags/v${FREEROUTING_VERSION}" \
            | jq -r '.assets[] | select(.name == "freerouting-'"${FREEROUTING_VERSION}"'.jar") | .browser_download_url')
          test -n "$asset_url"
          test "$asset_url" != "null"
          curl -fL "$asset_url" -o build/rev-b-router/freerouting.jar
          java -version 2>&1 | tee build/rev-b-router/java-version.txt

      - name: Export and route six-channel ESC
        shell: bash
        run: |
          set -euo pipefail
          board=hardware/esc/rev_b/esc_rev_b.kicad_pcb
          python3 tools/hardware/route_rev_b_specctra.py export \
            "$board" build/rev-b-router/esc.dsn
          set +e
          timeout 300m java -Xmx6g -Djava.awt.headless=true \
            -jar build/rev-b-router/freerouting.jar \
            --gui.enabled=false \
            -de build/rev-b-router/esc.dsn \
            -do build/rev-b-router/esc.ses \
            -mp 180 -mt 2 -oit 0.01 -us hybrid -hr 1:2 -is prioritized \
            -da -dct 1 --logging.console.level=INFO --logging.file.enabled=false \
            > build/rev-b-router/esc-freerouting.log 2>&1
          router_rc=$?
          set -e
          echo "$router_rc" > build/rev-b-router/esc-freerouting.exit
          test -s build/rev-b-router/esc.ses
          python3 tools/hardware/route_rev_b_specctra.py import \
            "$board" build/rev-b-router/esc.ses
          set +e
          kicad-cli pcb drc --severity-all --format json \
            -o build/rev-b-router/esc-drc.json "$board"
          echo $? > build/rev-b-router/esc-drc.exit
          set -e
          jq '{unconnected: (.unconnected_items | length), violations: (.violations | length), error_violations: ([.violations[] | select(.severity == "error")] | length)}' \
            build/rev-b-router/esc-drc.json | tee build/rev-b-router/esc-summary.json

      - name: Upload ESC routed board
        uses: actions/upload-artifact@v4
        with:
          name: rev-b-esc-routed
          path: |
            hardware/esc/rev_b/esc_rev_b.kicad_pcb
            build/rev-b-router/esc.*
            build/rev-b-router/esc-*
            build/rev-b-router/java-version.txt
          if-no-files-found: error
          retention-days: 3

  commit-routing:
    runs-on: ubuntu-latest
    needs:
      - route-main
      - route-esc
    steps:
      - name: Check out consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Download routed boards
        uses: actions/download-artifact@v4
        with:
          pattern: rev-b-*-routed
          path: build/routed-artifacts
          merge-multiple: false

      - name: Install routed boards and reports
        shell: bash
        run: |
          set -euo pipefail
          cp build/routed-artifacts/rev-b-main-routed/hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb \
            hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb
          cp build/routed-artifacts/rev-b-esc-routed/hardware/esc/rev_b/esc_rev_b.kicad_pcb \
            hardware/esc/rev_b/esc_rev_b.kicad_pcb
          mkdir -p hardware/main/rev_b/reports hardware/esc/rev_b/reports
          cp build/routed-artifacts/rev-b-main-routed/build/rev-b-router/main-drc.json \
            hardware/main/rev_b/reports/main_rev_b_autorouted_drc.json
          cp build/routed-artifacts/rev-b-main-routed/build/rev-b-router/main-summary.json \
            hardware/main/rev_b/reports/main_rev_b_autorouted_summary.json
          cp build/routed-artifacts/rev-b-esc-routed/build/rev-b-router/esc-drc.json \
            hardware/esc/rev_b/reports/esc_rev_b_autorouted_drc.json
          cp build/routed-artifacts/rev-b-esc-routed/build/rev-b-router/esc-summary.json \
            hardware/esc/rev_b/reports/esc_rev_b_autorouted_summary.json
          rm -f .github/workflows/rev-b-autoroute.yml
          rm -rf build/routed-artifacts

      - name: Commit routing pass to the existing PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rev-B Hardware Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "route: complete automated Rev-B routing pass"
          git push origin HEAD:agent/rev-b-fab-ready
