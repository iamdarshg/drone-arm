name: Route Rev-B PCBs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FREEROUTING_VERSION: 2.2.4
  KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD9_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints

jobs:
  route:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: main
            board: hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb
            passes: 100
            route_timeout: 120m
          - key: esc
            board: hardware/esc/rev_b/esc_rev_b.kicad_pcb
            passes: 180
            route_timeout: 300m

    steps:
      - name: Install KiCad and routing tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates kicad kicad-symbols kicad-footprints \
            python3 python3-venv curl jq tar gzip

      - name: Check out consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Download Java 25 and Freerouting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rev-b-router/jre25
          curl -fL \
            'https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jre/hotspot/normal/eclipse' \
            -o build/rev-b-router/jre25.tar.gz
          tar -xzf build/rev-b-router/jre25.tar.gz \
            --strip-components=1 -C build/rev-b-router/jre25

          asset_url=$(curl -fsSL \
            "https://api.github.com/repos/freerouting/freerouting/releases/tags/v${FREEROUTING_VERSION}" \
            | jq -r '.assets[] | select(.name == "freerouting-'"${FREEROUTING_VERSION}"'.jar") | .browser_download_url')
          test -n "$asset_url"
          test "$asset_url" != "null"
          curl -fL "$asset_url" -o build/rev-b-router/freerouting.jar
          build/rev-b-router/jre25/bin/java -version 2>&1 \
            | tee build/rev-b-router/${{ matrix.key }}-java-version.txt
          kicad-cli --version \
            | tee build/rev-b-router/${{ matrix.key }}-kicad-version.txt

      - name: Export, autoroute, import, and validate
        shell: bash
        run: |
          set -euo pipefail
          key=${{ matrix.key }}
          board=${{ matrix.board }}
          exec > >(tee "build/rev-b-router/${key}-stage.log") 2>&1

          python3 tools/hardware/route_rev_b_specctra.py export \
            "$board" "build/rev-b-router/${key}.dsn"

          set +e
          timeout ${{ matrix.route_timeout }} \
            build/rev-b-router/jre25/bin/java -Xmx6g -Djava.awt.headless=true \
            -jar build/rev-b-router/freerouting.jar \
            --gui.enabled=false \
            -de "build/rev-b-router/${key}.dsn" \
            -do "build/rev-b-router/${key}.ses" \
            -mp ${{ matrix.passes }} -mt 2 -oit 0.01 \
            -us hybrid -hr 1:2 -is prioritized \
            -da -dct 1 --logging.console.level=INFO --logging.file.enabled=false \
            > "build/rev-b-router/${key}-freerouting.log" 2>&1
          router_rc=$?
          set -e
          echo "$router_rc" > "build/rev-b-router/${key}-freerouting.exit"
          test -s "build/rev-b-router/${key}.ses"

          python3 tools/hardware/route_rev_b_specctra.py import \
            "$board" "build/rev-b-router/${key}.ses"

          set +e
          kicad-cli pcb drc --severity-all --format json \
            -o "build/rev-b-router/${key}-drc.json" "$board"
          drc_rc=$?
          set -e
          echo "$drc_rc" > "build/rev-b-router/${key}-drc.exit"
          jq '{unconnected: (.unconnected_items | length), violations: (.violations | length), error_violations: ([.violations[] | select(.severity == "error")] | length)}' \
            "build/rev-b-router/${key}-drc.json" \
            | tee "build/rev-b-router/${key}-summary.json"

      - name: Upload routed board and complete transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev-b-${{ matrix.key }}-routed
          path: |
            ${{ matrix.board }}
            build/rev-b-router/${{ matrix.key }}*
          if-no-files-found: error
          retention-days: 3

  commit-routing:
    runs-on: ubuntu-latest
    needs:
      - route
    steps:
      - name: Check out consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Download routed boards
        uses: actions/download-artifact@v4
        with:
          pattern: rev-b-*-routed
          path: build/routed-artifacts
          merge-multiple: false

      - name: Install routed boards and reports
        shell: bash
        run: |
          set -euo pipefail
          cp build/routed-artifacts/rev-b-main-routed/hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb \
            hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb
          cp build/routed-artifacts/rev-b-esc-routed/hardware/esc/rev_b/esc_rev_b.kicad_pcb \
            hardware/esc/rev_b/esc_rev_b.kicad_pcb
          mkdir -p hardware/main/rev_b/reports hardware/esc/rev_b/reports
          cp build/routed-artifacts/rev-b-main-routed/build/rev-b-router/main-drc.json \
            hardware/main/rev_b/reports/main_rev_b_autorouted_drc.json
          cp build/routed-artifacts/rev-b-main-routed/build/rev-b-router/main-summary.json \
            hardware/main/rev_b/reports/main_rev_b_autorouted_summary.json
          cp build/routed-artifacts/rev-b-esc-routed/build/rev-b-router/esc-drc.json \
            hardware/esc/rev_b/reports/esc_rev_b_autorouted_drc.json
          cp build/routed-artifacts/rev-b-esc-routed/build/rev-b-router/esc-summary.json \
            hardware/esc/rev_b/reports/esc_rev_b_autorouted_summary.json
          rm -f .github/workflows/rev-b-autoroute.yml
          rm -rf build/routed-artifacts

      - name: Commit routing pass to the existing PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rev-B Hardware Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "route: complete automated Rev-B routing pass"
          git push origin HEAD:agent/rev-b-fab-ready
