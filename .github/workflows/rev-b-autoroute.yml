name: Route Rev-B PCBs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD9_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints
  JAVA_HOME: /opt/java25
  PATH: /opt/java25/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build-router:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl jq tar gzip unzip

      - name: Install Temurin JDK 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/java25
          jdk_url=$(curl -fsSL \
            'https://api.adoptium.net/v3/assets/latest/25/hotspot?architecture=x64&image_type=jdk&os=linux&vendor=eclipse' \
            | jq -r '.[0].binary.package.link')
          test -n "$jdk_url"
          test "$jdk_url" != "null"
          curl -fL "$jdk_url" -o /tmp/temurin25-jdk.tar.gz
          tar -xzf /tmp/temurin25-jdk.tar.gz --strip-components=1 -C /opt/java25
          java -version
          javac -version

      - name: Build upstream router with trace-merge fixes
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/freerouting/freerouting.git /tmp/freerouting
          cd /tmp/freerouting
          git rev-parse HEAD | tee /tmp/freerouting-source-sha.txt
          grep -n 'hasTreeEntries' src/main/java/app/freerouting/board/PolylineTrace.java
          chmod +x gradlew
          ./gradlew --no-daemon executableJar
          mkdir -p /tmp/router-artifact
          cp build/libs/freerouting-current-executable.jar /tmp/router-artifact/freerouting-current-executable.jar
          cp /tmp/freerouting-source-sha.txt /tmp/router-artifact/source-sha.txt
          test -s /tmp/router-artifact/freerouting-current-executable.jar

      - name: Upload fixed router
        uses: actions/upload-artifact@v4
        with:
          name: fixed-freerouting
          path: /tmp/router-artifact
          if-no-files-found: error
          retention-days: 3

  route-main:
    needs: build-router
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 180
    steps:
      - name: Install KiCad and runtime tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates kicad kicad-symbols kicad-footprints \
            python3 python3-venv curl jq tar gzip

      - name: Install Temurin JRE 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/java25
          jre_url=$(curl -fsSL \
            'https://api.adoptium.net/v3/assets/latest/25/hotspot?architecture=x64&image_type=jre&os=linux&vendor=eclipse' \
            | jq -r '.[0].binary.package.link')
          curl -fL "$jre_url" -o /tmp/temurin25-jre.tar.gz
          tar -xzf /tmp/temurin25-jre.tar.gz --strip-components=1 -C /opt/java25
          java -version

      - name: Check out consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Download fixed router
        uses: actions/download-artifact@v4
        with:
          name: fixed-freerouting
          path: build/fixed-freerouting

      - name: Route remaining main-board nets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rev-b-router/main
          exec > >(tee build/rev-b-router/main/stage.log) 2>&1
          board=hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb
          cp build/fixed-freerouting/source-sha.txt build/rev-b-router/main/router-source-sha.txt
          kicad-cli --version | tee build/rev-b-router/main/kicad-version.txt
          java -version 2>&1 | tee build/rev-b-router/main/java-version.txt

          python3 tools/hardware/route_rev_b_sections.py strip-zones \
            --board "$board" \
            --output build/rev-b-router/main/main-nozones.kicad_pcb
          python3 tools/hardware/route_rev_b_sections.py export-main \
            --board build/rev-b-router/main/main-nozones.kicad_pcb \
            --dsn build/rev-b-router/main/main.dsn

          set +e
          timeout 150m java -Xmx6g -Djava.awt.headless=true \
            -jar build/fixed-freerouting/freerouting-current-executable.jar \
            --gui.enabled=false \
            -de build/rev-b-router/main/main.dsn \
            -do build/rev-b-router/main/main.ses \
            -mp 120 -mt 2 -oit 0.01 -us hybrid -hr 1:2 -is prioritized \
            -da -dct 1 --logging.console.level=INFO --logging.file.enabled=false \
            > build/rev-b-router/main/freerouting.log 2>&1
          echo $? > build/rev-b-router/main/freerouting.exit
          set -e
          test -s build/rev-b-router/main/main.ses

          python3 tools/hardware/route_rev_b_sections.py import-main \
            --board "$board" \
            --ses build/rev-b-router/main/main.ses \
            --output build/rev-b-router/main/main-imported.kicad_pcb
          python3 tools/hardware/route_rev_b_sections.py clean-main-import \
            --board build/rev-b-router/main/main-imported.kicad_pcb \
            --output build/rev-b-router/main/main-clean.kicad_pcb
          python3 tools/hardware/route_rev_b_sections.py fill-zones \
            --board build/rev-b-router/main/main-clean.kicad_pcb \
            --output "$board"

          set +e
          kicad-cli pcb drc --severity-all --format json \
            -o build/rev-b-router/main/drc.json "$board"
          echo $? > build/rev-b-router/main/drc.exit
          python3 tools/hardware/audit_rev_b_pcb.py \
            --kind main --board "$board" \
            --output build/rev-b-router/main/layout-audit.json
          echo $? > build/rev-b-router/main/layout-audit.exit
          set -e
          jq '{unconnected: (.unconnected_items | length), violations: (.violations | length), error_violations: ([.violations[] | select(.severity == "error")] | length)}' \
            build/rev-b-router/main/drc.json | tee build/rev-b-router/main/summary.json

      - name: Upload main routed board and transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev-b-main-routed
          path: |
            hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb
            build/rev-b-router/main
          if-no-files-found: error
          retention-days: 3

  route-esc:
    needs: build-router
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 330
    steps:
      - name: Install KiCad and runtime tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates kicad kicad-symbols kicad-footprints \
            python3 python3-venv curl jq tar gzip

      - name: Install Temurin JRE 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/java25
          jre_url=$(curl -fsSL \
            'https://api.adoptium.net/v3/assets/latest/25/hotspot?architecture=x64&image_type=jre&os=linux&vendor=eclipse' \
            | jq -r '.[0].binary.package.link')
          curl -fL "$jre_url" -o /tmp/temurin25-jre.tar.gz
          tar -xzf /tmp/temurin25-jre.tar.gz --strip-components=1 -C /opt/java25
          java -version

      - name: Check out consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Download fixed router
        uses: actions/download-artifact@v4
        with:
          name: fixed-freerouting
          path: build/fixed-freerouting

      - name: Route one motor cell, replicate six, and route shared nets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rev-b-router/esc
          exec > >(tee build/rev-b-router/esc/stage.log) 2>&1
          board=hardware/esc/rev_b/esc_rev_b.kicad_pcb
          cp build/fixed-freerouting/source-sha.txt build/rev-b-router/esc/router-source-sha.txt
          kicad-cli --version | tee build/rev-b-router/esc/kicad-version.txt
          java -version 2>&1 | tee build/rev-b-router/esc/java-version.txt

          python3 tools/hardware/route_rev_b_sections.py fix-ina296-reserved \
            --board "$board" \
            --output build/rev-b-router/esc/esc-fixed.kicad_pcb
          python3 tools/hardware/route_rev_b_sections.py extract-cell \
            --full build/rev-b-router/esc/esc-fixed.kicad_pcb \
            --cell build/rev-b-router/esc/m1-cell.kicad_pcb \
            --baseline build/rev-b-router/esc/m1-baseline.json \
            --dsn build/rev-b-router/esc/m1-cell.dsn

          set +e
          timeout 100m java -Xmx6g -Djava.awt.headless=true \
            -jar build/fixed-freerouting/freerouting-current-executable.jar \
            --gui.enabled=false \
            -de build/rev-b-router/esc/m1-cell.dsn \
            -do build/rev-b-router/esc/m1-cell.ses \
            -mp 100 -mt 2 -oit 0.01 -us hybrid -hr 1:2 -is prioritized \
            -da -dct 1 --logging.console.level=INFO --logging.file.enabled=false \
            > build/rev-b-router/esc/m1-freerouting.log 2>&1
          echo $? > build/rev-b-router/esc/m1-freerouting.exit
          set -e
          test -s build/rev-b-router/esc/m1-cell.ses

          python3 tools/hardware/route_rev_b_sections.py import-cell \
            --cell build/rev-b-router/esc/m1-cell.kicad_pcb \
            --ses build/rev-b-router/esc/m1-cell.ses \
            --output build/rev-b-router/esc/m1-cell-routed.kicad_pcb
          python3 tools/hardware/route_rev_b_sections.py replicate-cell \
            --full build/rev-b-router/esc/esc-fixed.kicad_pcb \
            --cell build/rev-b-router/esc/m1-cell-routed.kicad_pcb \
            --baseline build/rev-b-router/esc/m1-baseline.json \
            --output build/rev-b-router/esc/esc-replicated.kicad_pcb

          python3 tools/hardware/route_rev_b_sections.py strip-zones \
            --board build/rev-b-router/esc/esc-replicated.kicad_pcb \
            --output build/rev-b-router/esc/esc-replicated-nozones.kicad_pcb
          python3 tools/hardware/route_rev_b_sections.py export-main \
            --board build/rev-b-router/esc/esc-replicated-nozones.kicad_pcb \
            --dsn build/rev-b-router/esc/esc-shared.dsn

          set +e
          timeout 190m java -Xmx6g -Djava.awt.headless=true \
            -jar build/fixed-freerouting/freerouting-current-executable.jar \
            --gui.enabled=false \
            -de build/rev-b-router/esc/esc-shared.dsn \
            -do build/rev-b-router/esc/esc-shared.ses \
            -mp 140 -mt 2 -oit 0.01 -us hybrid -hr 1:2 -is prioritized \
            -da -dct 1 --logging.console.level=INFO --logging.file.enabled=false \
            > build/rev-b-router/esc/shared-freerouting.log 2>&1
          echo $? > build/rev-b-router/esc/shared-freerouting.exit
          set -e
          test -s build/rev-b-router/esc/esc-shared.ses

          python3 tools/hardware/route_rev_b_sections.py import-main \
            --board build/rev-b-router/esc/esc-replicated.kicad_pcb \
            --ses build/rev-b-router/esc/esc-shared.ses \
            --output build/rev-b-router/esc/esc-imported.kicad_pcb
          python3 tools/hardware/route_rev_b_sections.py fill-zones \
            --board build/rev-b-router/esc/esc-imported.kicad_pcb \
            --output "$board"

          set +e
          kicad-cli pcb drc --severity-all --format json \
            -o build/rev-b-router/esc/drc.json "$board"
          echo $? > build/rev-b-router/esc/drc.exit
          python3 tools/hardware/audit_rev_b_pcb.py \
            --kind esc --board "$board" \
            --output build/rev-b-router/esc/layout-audit.json
          echo $? > build/rev-b-router/esc/layout-audit.exit
          set -e
          jq '{unconnected: (.unconnected_items | length), violations: (.violations | length), error_violations: ([.violations[] | select(.severity == "error")] | length)}' \
            build/rev-b-router/esc/drc.json | tee build/rev-b-router/esc/summary.json

      - name: Upload ESC routed board and transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev-b-esc-routed
          path: |
            hardware/esc/rev_b/esc_rev_b.kicad_pcb
            build/rev-b-router/esc
          if-no-files-found: error
          retention-days: 3

  commit-routing:
    runs-on: ubuntu-latest
    needs:
      - route-main
      - route-esc
    steps:
      - name: Check out consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Download routed boards
        uses: actions/download-artifact@v4
        with:
          pattern: rev-b-*-routed
          path: build/routed-artifacts
          merge-multiple: false

      - name: Install routed boards and reports
        shell: bash
        run: |
          set -euo pipefail
          cp build/routed-artifacts/rev-b-main-routed/hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb \
            hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb
          cp build/routed-artifacts/rev-b-esc-routed/hardware/esc/rev_b/esc_rev_b.kicad_pcb \
            hardware/esc/rev_b/esc_rev_b.kicad_pcb
          mkdir -p hardware/main/rev_b/reports hardware/esc/rev_b/reports
          cp build/routed-artifacts/rev-b-main-routed/build/rev-b-router/main/drc.json \
            hardware/main/rev_b/reports/main_rev_b_autorouted_drc.json
          cp build/routed-artifacts/rev-b-main-routed/build/rev-b-router/main/layout-audit.json \
            hardware/main/rev_b/reports/main_rev_b_autorouted_layout_audit.json
          cp build/routed-artifacts/rev-b-main-routed/build/rev-b-router/main/summary.json \
            hardware/main/rev_b/reports/main_rev_b_autorouted_summary.json
          cp build/routed-artifacts/rev-b-esc-routed/build/rev-b-router/esc/drc.json \
            hardware/esc/rev_b/reports/esc_rev_b_autorouted_drc.json
          cp build/routed-artifacts/rev-b-esc-routed/build/rev-b-router/esc/layout-audit.json \
            hardware/esc/rev_b/reports/esc_rev_b_autorouted_layout_audit.json
          cp build/routed-artifacts/rev-b-esc-routed/build/rev-b-router/esc/summary.json \
            hardware/esc/rev_b/reports/esc_rev_b_autorouted_summary.json
          rm -f .github/workflows/rev-b-autoroute.yml
          rm -rf build/routed-artifacts

      - name: Commit routing pass to the existing PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rev-B Hardware Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "route: complete section-aware Rev-B routing pass"
          git push origin HEAD:agent/rev-b-fab-ready
