name: Rev-B fabrication readiness

on:
  push:
    branches:
      - agent/rev-b-fab-ready
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD9_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints

jobs:
  validate:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install KiCad and validation dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates kicad kicad-symbols kicad-footprints \
            python3 python3-venv python3-pip jq zip unzip

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure validation environment
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --disable-pip-version-check 'kicad-sch-api==0.5.6'
          mkdir -p validation-reports
          test -d "$KICAD_SYMBOL_DIR"
          test -d "$KICAD_FOOTPRINT_DIR"
          kicad-cli --version | tee validation-reports/kicad-version.txt
          .venv/bin/python -m py_compile \
            tools/hardware/generate_rev_b_schematics.py \
            tools/hardware/generate_rev_b_pcbs.py \
            tools/hardware/validate_rev_b_netlists.py \
            tools/hardware/audit_rev_b_pcb.py

      - name: Validate committed electrical connectivity
        shell: bash
        run: |
          set -euo pipefail
          kicad-cli sch export netlist --format kicadxml \
            -o validation-reports/esc-netlist.xml \
            hardware/esc/rev_b/esc_rev_b.kicad_sch
          kicad-cli sch export netlist --format kicadxml \
            -o validation-reports/main-netlist.xml \
            hardware/main/rev_b/main_rev_b.kicad_sch
          .venv/bin/python tools/hardware/validate_rev_b_netlists.py \
            validation-reports/esc-netlist.xml \
            validation-reports/main-netlist.xml \
            --output validation-reports/connectivity-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('validation-reports/connectivity-audit.json').read_text())
          assert audit['status'] == 'PASS', audit
          assert audit['checks'] == 239, audit
          assert audit['failures'] == 0, audit
          PY
          for number in 1 2 3 4 5 6; do
            test -s "hardware/esc/rev_b/motor_${number}.kicad_sch"
          done

      - name: Verify generators in an isolated copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rev-b-generated
          cp -a "$GITHUB_WORKSPACE" /tmp/rev-b-generated
          cd /tmp/rev-b-generated
          "$GITHUB_WORKSPACE/.venv/bin/python" tools/hardware/generate_rev_b_schematics.py --board both \
            > "$GITHUB_WORKSPACE/validation-reports/generate-schematics.log" 2>&1
          mkdir -p hardware/esc/rev_b/reports hardware/main/rev_b/reports
          kicad-cli sch export netlist --format kicadxml \
            -o hardware/esc/rev_b/reports/esc_rev_b_netlist.xml \
            hardware/esc/rev_b/esc_rev_b.kicad_sch
          kicad-cli sch export netlist --format kicadxml \
            -o hardware/main/rev_b/reports/main_rev_b_netlist.xml \
            hardware/main/rev_b/main_rev_b.kicad_sch
          "$GITHUB_WORKSPACE/.venv/bin/python" tools/hardware/validate_rev_b_netlists.py \
            hardware/esc/rev_b/reports/esc_rev_b_netlist.xml \
            hardware/main/rev_b/reports/main_rev_b_netlist.xml \
            --output "$GITHUB_WORKSPACE/validation-reports/regenerated-connectivity-audit.json"
          "$GITHUB_WORKSPACE/.venv/bin/python" tools/hardware/generate_rev_b_pcbs.py --board both \
            > "$GITHUB_WORKSPACE/validation-reports/generate-pcbs.log" 2>&1
          test -s hardware/esc/rev_b/esc_rev_b.kicad_pcb
          test -s hardware/main/rev_b/main_rev_b.kicad_pcb
          for number in 1 2 3 4 5 6; do
            test -s "hardware/esc/rev_b/motor_${number}.kicad_sch"
          done
          git diff --stat -- \
            hardware/esc/rev_b hardware/main/rev_b \
            docs/hardware/REV_B_GENERATION.json \
            > "$GITHUB_WORKSPACE/validation-reports/regeneration-diff-stat.txt"
          git diff -- \
            hardware/esc/rev_b hardware/main/rev_b \
            docs/hardware/REV_B_GENERATION.json \
            > "$GITHUB_WORKSPACE/validation-reports/regeneration.diff"

      - name: Record current design-readiness blockers
        shell: bash
        run: |
          set +e
          kicad-cli sch erc --severity-all --format json \
            -o validation-reports/esc-erc.json \
            hardware/esc/rev_b/esc_rev_b.kicad_sch
          echo $? > validation-reports/esc-erc.exit
          kicad-cli sch erc --severity-all --format json \
            -o validation-reports/main-erc.json \
            hardware/main/rev_b/main_rev_b.kicad_sch
          echo $? > validation-reports/main-erc.exit
          kicad-cli pcb drc --severity-all --format json \
            -o validation-reports/esc-drc.json \
            hardware/esc/rev_b/esc_rev_b.kicad_pcb
          echo $? > validation-reports/esc-drc.exit
          kicad-cli pcb drc --severity-all --format json \
            -o validation-reports/main-drc.json \
            hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb
          echo $? > validation-reports/main-drc.exit
          .venv/bin/python tools/hardware/audit_rev_b_pcb.py --kind esc \
            --board hardware/esc/rev_b/esc_rev_b.kicad_pcb \
            --output validation-reports/esc-layout-audit.json
          echo $? > validation-reports/esc-layout-audit.exit
          .venv/bin/python tools/hardware/audit_rev_b_pcb.py --kind main \
            --board hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pcb \
            --output validation-reports/main-layout-audit.json
          echo $? > validation-reports/main-layout-audit.exit
          set -e

      - name: Summarize readiness evidence
        if: always()
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          out = Path('validation-reports')
          summary = {'exit_codes': {}, 'reports': {}}
          for path in sorted(out.glob('*.exit')):
              value = path.read_text().strip()
              summary['exit_codes'][path.stem] = int(value) if value else None
          for name in (
              'connectivity-audit', 'regenerated-connectivity-audit',
              'esc-erc', 'main-erc', 'esc-drc', 'main-drc',
              'esc-layout-audit', 'main-layout-audit',
          ):
              path = out / f'{name}.json'
              if not path.exists():
                  continue
              try:
                  data = json.loads(path.read_text())
              except Exception as exc:
                  summary['reports'][name] = {'parse_error': str(exc)}
                  continue
              if name.endswith('-drc'):
                  summary['reports'][name] = {
                      'violations': len(data.get('violations', [])),
                      'unconnected_items': len(data.get('unconnected_items', [])),
                  }
              elif name.endswith('-erc'):
                  summary['reports'][name] = {
                      'violations': len(data.get('violations', [])),
                  }
              else:
                  summary['reports'][name] = data.get('summary', {
                      'status': data.get('status'),
                      'checks': data.get('checks'),
                      'failures': data.get('failures'),
                  })
          text = json.dumps(summary, indent=2) + '\n'
          (out / 'baseline-summary.json').write_text(text)
          print(text)
          PY
          {
            echo '## Rev-B fabrication readiness'
            echo
            echo '```json'
            cat validation-reports/baseline-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export repository source bundle
        if: always()
        shell: bash
        run: git bundle create validation-reports/rev-b-source.bundle --all

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev-b-fabrication-readiness
          path: validation-reports
          if-no-files-found: error
          retention-days: 3
