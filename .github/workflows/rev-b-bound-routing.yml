name: Bound Rev-B autorouter

on:
  push:
    branches:
      - agent/rev-b-fab-release

concurrency:
  group: rev-b-fab-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-release
          fetch-depth: 0
      - name: Bound Freerouting passes and remove this helper
        shell: bash
        run: |
          git config user.name "rev-b-build[bot]"
          git config user.email "rev-b-build[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/rev-b-orchestrate.yml')
          text = path.read_text(encoding='utf-8')
          marker = '-jar build/rev-b/freerouting.jar \\'
          replacement = '-jar build/rev-b/freerouting.jar -mp 10 -mt 4 --gui.enabled=false -da -dl \\'
          text = text.replace(marker, replacement)
          if text.count('-mp 10 -mt 4') != 3:
              raise RuntimeError('Expected three bounded Freerouting invocations')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/rev-b-bound-routing.yml').unlink()
          PY
          git add -A .github/workflows
          git commit -m 'ci: cap rev-b autorouter passes'
          git push origin HEAD:agent/rev-b-fab-release
