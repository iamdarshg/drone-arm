name: Resume Rev-B ESC routing

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

env:
  SOURCE_RUN_ID: 29693302481
  JAVA_HOME: /opt/java25
  PATH: /opt/java25/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  route-shared-esc:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 240
    steps:
      - name: Install KiCad and runtime tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates kicad kicad-symbols kicad-footprints \
            python3 curl jq tar gzip

      - name: Install Temurin JRE 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/java25
          jre_url=$(curl -fsSL \
            'https://api.adoptium.net/v3/assets/latest/25/hotspot?architecture=x64&image_type=jre&os=linux&vendor=eclipse' \
            | jq -r '.[0].binary.package.link')
          test -n "$jre_url"
          test "$jre_url" != "null"
          curl -fL "$jre_url" -o /tmp/temurin25-jre.tar.gz
          tar -xzf /tmp/temurin25-jre.tar.gz --strip-components=1 -C /opt/java25
          java -version

      - name: Check out consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Download fixed router
        uses: actions/download-artifact@v4
        with:
          name: fixed-freerouting
          path: build/fixed-freerouting
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download replicated ESC checkpoint
        uses: actions/download-artifact@v4
        with:
          name: rev-b-esc-routed
          path: build/source-esc
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Route remaining ESC connections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/recovery/esc
          exec > >(tee build/recovery/esc/stage.log) 2>&1

          routed=build/source-esc/build/rev-b-router/esc/esc-replicated.kicad_pcb
          no_zones=build/source-esc/build/rev-b-router/esc/esc-replicated-nozones.kicad_pcb
          test -s "$routed"
          test -s "$no_zones"
          cp build/fixed-freerouting/source-sha.txt build/recovery/esc/router-source-sha.txt
          kicad-cli --version | tee build/recovery/esc/kicad-version.txt
          java -version 2>&1 | tee build/recovery/esc/java-version.txt

          python3 tools/hardware/route_rev_b_sections.py export-main \
            --board "$no_zones" \
            --dsn build/recovery/esc/esc-shared.dsn

          set +e
          timeout 205m java -Xmx6g -Djava.awt.headless=true \
            -jar build/fixed-freerouting/freerouting-current-executable.jar \
            --gui.enabled=false \
            -de build/recovery/esc/esc-shared.dsn \
            -do build/recovery/esc/esc-shared.ses \
            -mp 170 -mt 2 -oit 0.01 -us hybrid -hr 1:2 -is prioritized \
            -da -dct 1 --logging.console.level=INFO --logging.file.enabled=false \
            > build/recovery/esc/freerouting.log 2>&1
          router_rc=$?
          set -e
          echo "$router_rc" > build/recovery/esc/freerouting.exit
          test -s build/recovery/esc/esc-shared.ses

          python3 tools/hardware/route_rev_b_sections.py import-main \
            --board "$routed" \
            --ses build/recovery/esc/esc-shared.ses \
            --output build/recovery/esc/esc-imported.kicad_pcb
          python3 tools/hardware/route_rev_b_sections.py fill-zones \
            --board build/recovery/esc/esc-imported.kicad_pcb \
            --output hardware/esc/rev_b/esc_rev_b.kicad_pcb

          set +e
          kicad-cli pcb drc --severity-all --format json \
            -o build/recovery/esc/drc.json \
            hardware/esc/rev_b/esc_rev_b.kicad_pcb
          echo $? > build/recovery/esc/drc.exit
          python3 tools/hardware/audit_rev_b_pcb.py \
            --kind esc --board hardware/esc/rev_b/esc_rev_b.kicad_pcb \
            --output build/recovery/esc/layout-audit.json
          echo $? > build/recovery/esc/layout-audit.exit
          set -e

          jq '{unconnected: (.unconnected_items | length), violations: (.violations | length), error_violations: ([.violations[] | select(.severity == "error")] | length)}' \
            build/recovery/esc/drc.json | tee build/recovery/esc/summary.json

      - name: Upload recovered ESC result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rev-b-esc-recovered
          path: |
            hardware/esc/rev_b/esc_rev_b.kicad_pcb
            build/recovery/esc
          if-no-files-found: error
          retention-days: 3

  commit-esc-routing:
    needs: route-shared-esc
    runs-on: ubuntu-latest
    steps:
      - name: Check out consolidated branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Download recovered ESC result
        uses: actions/download-artifact@v4
        with:
          name: rev-b-esc-recovered
          path: build/completed-esc

      - name: Install board and reports
        shell: bash
        run: |
          set -euo pipefail
          cp build/completed-esc/hardware/esc/rev_b/esc_rev_b.kicad_pcb \
            hardware/esc/rev_b/esc_rev_b.kicad_pcb
          mkdir -p hardware/esc/rev_b/reports
          cp build/completed-esc/build/recovery/esc/drc.json \
            hardware/esc/rev_b/reports/esc_rev_b_autorouted_drc.json
          cp build/completed-esc/build/recovery/esc/layout-audit.json \
            hardware/esc/rev_b/reports/esc_rev_b_autorouted_layout_audit.json
          cp build/completed-esc/build/recovery/esc/summary.json \
            hardware/esc/rev_b/reports/esc_rev_b_autorouted_summary.json
          rm -f .github/workflows/rev-b-esc-recovery.yml
          rm -rf build/completed-esc

      - name: Commit ESC routing checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rev-B Hardware Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "route: continue Rev-B ESC routing from replicated cells"
          git push origin HEAD:agent/rev-b-fab-ready
