name: Patch main-signal project context v2

on:
  push:
    branches:
      - agent/rev-b-fab-ready
    paths:
      - .github/workflows/rev-b-patch-signal-project-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0

      - name: Patch candidate project copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rev-B Hardware Bot"
          git config user.email "actions@users.noreply.github.com"

          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rev-b-main-signal-recovery.yml')
          text = path.read_text()
          exact_copy = '''          cp hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pro \\
            hardware/main/rev_b/main_rev_b_signal_candidate.kicad_pro
          '''
          if exact_copy in text:
              raise SystemExit(0)
          marker = '''          if ! test -s "$candidate"; then
            cp hardware/main/rev_b/main_rev_b_signal_clean.kicad_pcb "$candidate"
          fi

          set +e
          kicad-cli pcb drc'''
          replacement = '''          if ! test -s "$candidate"; then
            cp hardware/main/rev_b/main_rev_b_signal_clean.kicad_pcb "$candidate"
          fi
          cp hardware/main/rev_b/main_rev_b_routed_iter2_filled.kicad_pro \\
            hardware/main/rev_b/main_rev_b_signal_candidate.kicad_pro

          set +e
          kicad-cli pcb drc'''
          if marker not in text:
              raise SystemExit('candidate DRC marker not found')
          path.write_text(text.replace(marker, replacement, 1))
          PY

          for attempt in 1 2 3; do
            git fetch origin agent/rev-b-fab-ready
            git reset --hard origin/agent/rev-b-fab-ready
            python3 /tmp/patch.py
            rm -f .github/workflows/rev-b-patch-signal-project-v2.yml
            git add -A
            git diff --cached --check
            git commit -m 'fix: attach project rules to signal candidate'
            if git push origin HEAD:agent/rev-b-fab-ready; then
              exit 0
            fi
          done
          exit 1
