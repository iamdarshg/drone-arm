name: Regenerate Rev-B sources

on:
  push:
    branches:
      - agent/rev-b-fab-ready
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD9_SYMBOL_DIR: /usr/share/kicad/symbols
  KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints

jobs:
  generate:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install generation dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates kicad kicad-symbols kicad-footprints \
            python3 python3-venv python3-pip
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/rev-b-fab-ready
          fetch-depth: 0
      - name: Configure environment
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "rev-b-build[bot]"
          git config user.email "rev-b-build[bot]@users.noreply.github.com"
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --disable-pip-version-check 'kicad-sch-api==0.5.6'
          mkdir -p hardware/esc/rev_b/reports hardware/main/rev_b/reports
      - name: Make generators portable and deterministic
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path

          sch = Path('tools/hardware/generate_rev_b_schematics.py')
          text = sch.read_text(encoding='utf-8')
          text = text.replace('import json\nimport shutil\n', 'import json\nimport re\nimport shutil\n')
          old = '''_rp2354_library_info = ksa.get_symbol_info("MCU_RaspberryPi:RP2354B")
          if _rp2354_library_info is None:
              raise RuntimeError("Installed KiCad library does not contain MCU_RaspberryPi:RP2354B")
          RP2354B_PINS = tuple((pin.number, pin.name) for pin in _rp2354_library_info.pins)
          '''
          new = '''def load_rp2354_pins() -> tuple[tuple[str, str], ...]:
              """Load RP2354B pins from KiCad or the committed audited symbol."""
              library_info = ksa.get_symbol_info("MCU_RaspberryPi:RP2354B")
              if library_info is not None:
                  return tuple((pin.number, pin.name) for pin in library_info.pins)
              pin_pattern = re.compile(
                  r"\\(pin\\s+.*?\\(name\\s+\\\"([^\\\"]+)\\\".*?"
                  r"\\(number\\s+\\\"([^\\\"]+)\\\"",
                  re.DOTALL,
              )
              for path in (MAIN_DIR / "revb.kicad_sym", ESC_DIR / "revb.kicad_sym"):
                  if not path.exists():
                      continue
                  source = path.read_text(encoding="utf-8")
                  start = source.find('(symbol "RP2354B"')
                  if start < 0:
                      continue
                  end = source.find('\\n  (symbol "', start + 1)
                  block = source[start:] if end < 0 else source[start:end]
                  matches = pin_pattern.findall(block)
                  pins = tuple((number, name) for name, number in matches)
                  if len(pins) == 81:
                      return pins
              raise RuntimeError(
                  "RP2354B is absent from the installed KiCad library and the "
                  "committed Rev-B fallback symbol could not be parsed"
              )


          RP2354B_PINS = load_rp2354_pins()
          '''
          if old in text:
              text = text.replace(old, new)
          elif 'def load_rp2354_pins()' not in text:
              raise SystemExit('RP2354B generator block not found')
          sch.write_text(text, encoding='utf-8')

          pcb = Path('tools/hardware/generate_rev_b_pcbs.py')
          text = pcb.read_text(encoding='utf-8')
          text = text.replace('import math\nimport re\n', 'import math\nimport os\nimport re\n')
          old = 'KICAD_FP_ROOT = Path(r"C:\\Program Files\\KiCad\\9.0\\share\\kicad\\footprints")\n'
          new = '''def discover_footprint_root() -> Path:
              """Locate the standard KiCad footprint libraries on Windows or Linux."""
              candidates = [
                  Path(value)
                  for key in ("KICAD_FOOTPRINT_DIR", "KICAD9_FOOTPRINT_DIR")
                  if (value := os.environ.get(key))
              ]
              candidates.extend(
                  [
                      Path(r"C:\\Program Files\\KiCad\\9.0\\share\\kicad\\footprints"),
                      Path("/usr/share/kicad/footprints"),
                      Path("/usr/local/share/kicad/footprints"),
                  ]
              )
              for candidate in candidates:
                  if candidate.is_dir():
                      return candidate
              raise RuntimeError("Unable to locate KiCad footprints; set KICAD_FOOTPRINT_DIR")


          KICAD_FP_ROOT = discover_footprint_root()
          '''
          if old in text:
              text = text.replace(old, new)
          elif 'def discover_footprint_root()' not in text:
              raise SystemExit('KiCad footprint root block not found')
          pcb.write_text(text, encoding='utf-8')
          PY
          .venv/bin/python -m py_compile \
            tools/hardware/generate_rev_b_schematics.py \
            tools/hardware/generate_rev_b_pcbs.py
      - name: Generate sources and diagnostics
        shell: bash
        run: |
          set +e
          REPORT=hardware/esc/rev_b/reports/generation_status.txt
          : > "$REPORT"

          .venv/bin/python tools/hardware/generate_rev_b_schematics.py --board both \
            > hardware/esc/rev_b/reports/generate_schematics.log 2>&1
          echo "generate_schematics=$?" | tee -a "$REPORT"

          kicad-cli sch export netlist --format kicadxml \
            -o hardware/esc/rev_b/reports/esc_rev_b_netlist.xml \
            hardware/esc/rev_b/esc_rev_b.kicad_sch \
            > hardware/esc/rev_b/reports/export_esc_netlist.log 2>&1
          echo "export_esc_netlist=$?" | tee -a "$REPORT"

          kicad-cli sch export netlist --format kicadxml \
            -o hardware/main/rev_b/reports/main_rev_b_netlist.xml \
            hardware/main/rev_b/main_rev_b.kicad_sch \
            > hardware/main/rev_b/reports/export_main_netlist.log 2>&1
          echo "export_main_netlist=$?" | tee -a "$REPORT"

          if [ -f hardware/esc/rev_b/reports/esc_rev_b_netlist.xml ] && \
             [ -f hardware/main/rev_b/reports/main_rev_b_netlist.xml ]; then
            .venv/bin/python tools/hardware/validate_rev_b_netlists.py \
              hardware/esc/rev_b/reports/esc_rev_b_netlist.xml \
              hardware/main/rev_b/reports/main_rev_b_netlist.xml \
              --output hardware/esc/rev_b/reports/rev_b_connectivity_audit.json \
              > hardware/esc/rev_b/reports/connectivity_audit.log 2>&1
            echo "connectivity_audit=$?" | tee -a "$REPORT"
          else
            echo "connectivity_audit=skipped" | tee -a "$REPORT"
          fi

          .venv/bin/python tools/hardware/generate_rev_b_pcbs.py --board both \
            > hardware/esc/rev_b/reports/generate_pcbs.log 2>&1
          echo "generate_pcbs=$?" | tee -a "$REPORT"

          for board in esc main; do
            if [ "$board" = esc ]; then
              ROOT=hardware/esc/rev_b/esc_rev_b
              OUT=hardware/esc/rev_b/reports
            else
              ROOT=hardware/main/rev_b/main_rev_b
              OUT=hardware/main/rev_b/reports
            fi
            if [ -f "${ROOT}.kicad_sch" ]; then
              kicad-cli sch erc --severity-all --format json \
                -o "$OUT/${board}_rev_b_erc.json" "${ROOT}.kicad_sch" \
                > "$OUT/${board}_erc.log" 2>&1
              echo "${board}_erc=$?" | tee -a "$REPORT"
            fi
            if [ -f "${ROOT}.kicad_pcb" ]; then
              kicad-cli pcb drc --severity-all --format json \
                -o "$OUT/${board}_rev_b_preroute_drc.json" "${ROOT}.kicad_pcb" \
                > "$OUT/${board}_preroute_drc.log" 2>&1
              echo "${board}_preroute_drc=$?" | tee -a "$REPORT"
            fi
          done
          set -e
      - name: Commit generated sources and diagnostics
        shell: bash
        run: |
          git add \
            tools/hardware/generate_rev_b_schematics.py \
            tools/hardware/generate_rev_b_pcbs.py \
            docs/hardware/REV_B_GENERATION.json \
            hardware/esc/rev_b \
            hardware/main/rev_b
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'build: generate rev-b outputs'
          for attempt in 1 2 3; do
            git fetch origin agent/rev-b-fab-ready
            if git rebase origin/agent/rev-b-fab-ready && \
               git push origin HEAD:agent/rev-b-fab-ready; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo 'Unable to publish generated outputs after three rebased attempts.' >&2
          exit 1
